; ESP32-C3 Super Mini firmware for the TI-84 Plus CE internal Wi-Fi mod.
; Serial == USB-Serial-JTAG (HWCDC), wired straight to the calculator's USB pads.

[platformio]
default_envs = c3_supermini  ; plain `pio run` must not also build bench/OTA

[env:c3_supermini]
platform = espressif32@6.9.0  ; Arduino core 2.0.17
board = esp32-c3-devkitm-1
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0  ; Serial is the calc protocol link, no log_x() output
lib_deps =
    tzapu/WiFiManager@^2.0.17
    bblanchon/ArduinoJson@^7.2.0

; Bench testing from a PC, before VBUS sense is wired: stays attached to USB.
;   pio run -e c3_bench -t upload && pio device monitor
[env:c3_bench]
extends = env:c3_supermini
build_flags =
    ${env:c3_supermini.build_flags}
    -D BENCH_MODE=1

; Classic ESP32 DevKit (CH340 USB-UART), used externally on a Mini-B OTG cable.
; The calculator talks to the CH340 with its own driver (calc/src/main.c); there
; is no USB arbitration, so it behaves like the bench build.
;   pio run -e esp32_devkit -t upload
[env:esp32_devkit]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
board_build.f_cpu = 80000000L
monitor_speed = 115200
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D BENCH_MODE=1
lib_deps = ${env:c3_supermini.lib_deps}

; After the board is sealed inside the calculator, flash over Wi-Fi instead:
;   pio run -e ota -t upload
[env:ota]
extends = env:c3_supermini
upload_protocol = espota
upload_port = ti84-wifi.local
